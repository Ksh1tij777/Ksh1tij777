<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 290" width="600" height="290" role="img" aria-label="Most used languages"><style>@font-face{font-family:'KVMono-m';src:url(data:font/woff2;base64,) format('woff2');font-style:normal;font-weight:400}.m{font-family:'KVMono-m','SFMono-Regular',Consolas,Menlo,monospace;font-style:normal;font-weight:400}@font-face{font-family:'KVMono-mm';src:url(data:font/woff2;base64,) format('woff2');font-style:normal;font-weight:500}.mm{font-family:'KVMono-mm','SFMono-Regular',Consolas,Menlo,monospace;font-style:normal;font-weight:500}@font-face{font-family:'KVSerif-d';src:url(data:font/woff2;base64,) format('woff2');font-style:normal;font-weight:400}.d{font-family:'KVSerif-d',Georgia,'Times New Roman',serif;font-style:normal;font-weight:400}
.fade{opacity:0;animation:fade .8s ease-out forwards}
@keyframes fade{to{opacity:1}}
.flow{stroke-dasharray:3 6;animation:flow 1.4s linear infinite}
@keyframes flow{to{stroke-dashoffset:-18}}
.ping{transform-box:fill-box;transform-origin:center;animation:ping 2.4s ease-out infinite}
@keyframes ping{0%{transform:scale(.6);opacity:.8}100%{transform:scale(2.8);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important;stroke-dashoffset:0!important;transform:none!important}}

.grow{transform-box:fill-box;transform-origin:left;transform:scaleX(0);animation:grow 1.2s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes grow{to{transform:scaleX(1)}}
.draw{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw 2.6s ease-out .2s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.2s ease-out infinite}
@keyframes pulse{0%{transform:scale(.6);opacity:.8}100%{transform:scale(2.6);opacity:0}}
