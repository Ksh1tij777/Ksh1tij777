<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 330" width="600" height="330" role="img" aria-label="Cassandra project card">
<style>
.draw{stroke-dasharray:var(--len,800);stroke-dashoffset:var(--len,800);animation:draw 6s ease-in-out infinite}
@keyframes draw{0%{stroke-dashoffset:var(--len,800)}35%,85%{stroke-dashoffset:0}100%{stroke-dashoffset:0;opacity:0}}
.flow{stroke-dasharray:4 6;animation:flow 1.2s linear infinite}
@keyframes flow{to{stroke-dashoffset:-20}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.8s ease-out infinite}
@keyframes pulse{0%{transform:scale(.6);opacity:.9}100%{transform:scale(2.6);opacity:0}}
.blink{animation:blink 6s ease-in-out infinite}
@keyframes blink{0%,30%{opacity:0}40%,85%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;stroke-dashoffset:0!important;opacity:1!important}}
.eyescan{animation:es 3s ease-in-out infinite}
@keyframes es{0%{transform:translateX(0)}60%,100%{transform:translateX(200px);opacity:0}}
.bad{animation:bad 1.4s ease-in-out infinite}
@keyframes bad{0%,100%{opacity:.45}50%{opacity:1}}
.iris{transform-box:fill-box;transform-origin:center;animation:look 4s ease-in-out infinite}
@keyframes look{0%,100%{transform:translate(-5px,0)}50%{transform:translate(5px,0)}}</style>
<rect width="600" height="330" rx="14" fill="#0d1124"/>
<rect x=".5" y=".5" width="599" height="329" rx="14" fill="none" stroke="#2a3150"/>
<text x="28" y="38" font-family="'JetBrains Mono','IBM Plex Mono',Consolas,'SFMono-Regular',Menlo,monospace" font-size="11" fill="#67e8f9" text-anchor="start" letter-spacing="1.8" >THE AGENT THAT WATCHES AGENTS</text>
<text x="28" y="72" font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="30" fill="#e6e9f5" text-anchor="start" letter-spacing="-0.5" font-weight="700" >Cassandra</text>
<text x="572" y="38" font-family="'JetBrains Mono','IBM Plex Mono',Consolas,'SFMono-Regular',Menlo,monospace" font-size="11" fill="#fcd34d" text-anchor="end" letter-spacing="1.4" >🥇 1ST / 14,000+ · GOOGLE CLOUD</text>
<text x="28" y="95" font-family="'JetBrains Mono','IBM Plex Mono',Consolas,'SFMono-Regular',Menlo,monospace" font-size="10" fill="#8b93b0" text-anchor="start" letter-spacing="1.4" >PHOENIX TRACE</text><rect x="98" y="108" width="150" height="12" rx="3" fill="#a5b4fc" opacity=".85" ><animate attributeName="width" from="0" to="150" dur="0.6s" begin="0.00s" fill="freeze"/></rect><text x="28" y="118" font-family="'JetBrains Mono','IBM Plex Mono',Consolas,'SFMono-Regular',Menlo,monospace" font-size="9.5" fill="#8b93b0" text-anchor="start" letter-spacing="0.4" >agent.run</text><rect x="112" y="132" width="60" height="12" rx="3" fill="#6b7bd6" opacity=".85" ><animate attributeName="width" from="0" to="60" dur="0.6s" begin="0.25s" fill="freeze"/></rect><text x="28" y="142" font-family="'JetBrains Mono','IBM Plex Mono',Consolas,'SFMono-Regular',Menlo,monospace" font-size="9.5" fill="#8b93b0" text-anchor="start" letter-spacing="0.4" >llm.plan</text><rect x="128" y="156" width="46" height="12" rx="3" fill="#f87171" opacity=".85" class="bad"><animate attributeName="width" from="0" to="46" dur="0.6s" begin="0.50s" fill="freeze"/></rect><text x="28" y="166" font-family="'JetBrains Mono','IBM Plex Mono',Consolas,'SFMono-Regular',Menlo,monospace" font-size="9.5" fill="#8b93b0" text-anchor="start" letter-spacing="0.4" >tool.lookup</text><rect x="178" y="180" width="56" height="12" rx="3" fill="#6b7bd6" opacity=".85" ><animate attributeName="width" from="0" to="56" dur="0.6s" begin="0.75s" fill="freeze"/></rect><text x="28" y="190" font-family="'JetBrains Mono','IBM Plex Mono',Consolas,'SFMono-Regular',Menlo,monospace" font-size="9.5" fill="#8b93b0" text-anchor="start" letter-spacing="0.4" >llm.answer</text><rect x="194" y="204" width="40" height="12" rx="3" fill="#6b7bd6" opacity=".85" ><animate attributeName="width" from="0" to="40" dur="0.6s" begin="1.00s" fill="freeze"/></rect><text x="28" y="214" font-family="'JetBrains Mono','IBM Plex Mono',Consolas,'SFMono-Regular',Menlo,monospace" font-size="9.5" fill="#8b93b0" text-anchor="start" letter-spacing="0.4" >respond</text><rect class="eyescan" x="94" y="102" width="2" height="122" fill="#67e8f9" opacity=".8"/><circle class="pulse" cx="184" cy="162" r="5" fill="none" stroke="#f87171" stroke-width="1.5"/><text x="194" y="166" font-family="'JetBrains Mono','IBM Plex Mono',Consolas,'SFMono-Regular',Menlo,monospace" font-size="9.5" fill="#f87171" text-anchor="start" letter-spacing="0.3" >empty → fabricated</text><path class="flow" d="M278 164 C340 164 360 188 394 188" stroke="#f87171" stroke-opacity=".8" fill="none"/><path d="M394 183 L402 188 L394 193Z" fill="#f87171"/><circle cx="470" cy="166" r="62" fill="none" stroke="#2a3150" stroke-width="1.5"/><circle class="flow" cx="470" cy="166" r="62" fill="none" stroke="#a5b4fc" stroke-opacity=".6"/><path d="M470.0 98.0L476.0 104.0L470.0 110.0L464.0 104.0Z" fill="#67e8f9"/><text x="470.0" y="92.0" font-family="'JetBrains Mono','IBM Plex Mono',Consolas,'SFMono-Regular',Menlo,monospace" font-size="9.5" fill="#8b93b0" text-anchor="middle" letter-spacing="1" >DIAGNOSE</text><path d="M532.0 160.0L538.0 166.0L532.0 172.0L526.0 166.0Z" fill="#e6e9f5"/><text x="546.0" y="170.0" font-family="'JetBrains Mono','IBM Plex Mono',Consolas,'SFMono-Regular',Menlo,monospace" font-size="9.5" fill="#8b93b0" text-anchor="start" letter-spacing="1" >EVALS</text><path d="M470.0 222.0L476.0 228.0L470.0 234.0L464.0 228.0Z" fill="#e6e9f5"/><text x="470.0" y="250.0" font-family="'JetBrains Mono','IBM Plex Mono',Consolas,'SFMono-Regular',Menlo,monospace" font-size="9.5" fill="#8b93b0" text-anchor="middle" letter-spacing="1" >PATCH</text><path d="M408.0 160.0L414.0 166.0L408.0 172.0L402.0 166.0Z" fill="#e6e9f5"/><text x="408.0" y="152.0" font-family="'JetBrains Mono','IBM Plex Mono',Consolas,'SFMono-Regular',Menlo,monospace" font-size="9.5" fill="#8b93b0" text-anchor="middle" letter-spacing="1" >RED-TEAM</text><circle r="4.5" fill="#67e8f9"><animateMotion dur="4s" repeatCount="indefinite" path="M470 104 A62 62 0 1 1 469.99 104"/></circle><circle cx="470" cy="166" r="20" fill="#141a33" stroke="#a5b4fc" stroke-width="1.5"/><circle class="iris" cx="470" cy="166" r="8" fill="#a5b4fc"/><circle cx="470" cy="166" r="3.5" fill="#0d1124"/><text x="98" y="246" font-family="'JetBrains Mono','IBM Plex Mono',Consolas,'SFMono-Regular',Menlo,monospace" font-size="10" fill="#86efac" text-anchor="start" letter-spacing="0.3" class="blink">✓ fix replayed on the original failure</text>
<line x1="28" x2="572" y1="258" y2="258" stroke="#2a3150"/>
<text x="28" y="284" font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" fill="#e6e9f5" text-anchor="start" letter-spacing="0" >Reads live Phoenix traces, catches the failing span, writes evals, patches the</text><text x="28" y="305" font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" fill="#e6e9f5" text-anchor="start" letter-spacing="0" >prompt and red-teams its own fix. No human in the loop.</text>
</svg>