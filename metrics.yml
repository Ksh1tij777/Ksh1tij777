name: Metrics

on:
  schedule:
    - cron: "0 0 * * *"     # daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      # 3D contribution calendar (full year)
      - uses: lowlighter/metrics@latest
        with:
          filename: assets/metrics/isocalendar.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          config_timezone: Asia/Kolkata
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      # Most-used languages
      - uses: lowlighter/metrics@latest
        with:
          filename: assets/metrics/languages.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          config_timezone: Asia/Kolkata
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_details: percentage
          plugin_languages_colors: github

      # Overview: commits, PRs, issues, repos + recent activity
      - uses: lowlighter/metrics@latest
        with:
          filename: assets/metrics/overview.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: header, activity, community, repositories
          config_timezone: Asia/Kolkata

      # Achievements badges
      - uses: lowlighter/metrics@latest
        with:
          filename: assets/metrics/achievements.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          config_timezone: Asia/Kolkata
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: C
          plugin_achievements_limit: 8
