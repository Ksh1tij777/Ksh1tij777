name: Generate snake

on:
  schedule:
    - cron: "30 18 * * *"   # daily, ~midnight IST
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/snake.yml"]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=#ff5b35&color_dots=#ebedf0,#f6d3c4,#f2a589,#ec7a55,#d9481f
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#ff5b35&color_dots=#1c1a17,#3b2a22,#6b3a28,#b24a2e,#ff5b35

      - name: Push to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
